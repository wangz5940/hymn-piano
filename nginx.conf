server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 默认字符集
    charset utf-8;

    # SPA 前端路由：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SimpMusic 字体文件（浏览器通过 @font-face url() 加载）
    location /__simpmusic-fonts/ {
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
        add_header Content-Type "font/ttf";
    }

    # 歌谱图片
    location /歌谱/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 结构化曲谱 JSON
    location /materials/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # 静态资源长缓存
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml font/ttf;
    gzip_min_length 1024;
}
